name: Publish OSS

# OSS self-host — PyPI `opengateways` + GHCR `ghcr.io/mrdulasolutions/open-gateway`.
# Import package remains `opengateway`; CLI: `opengateways` (alias `opengateway`).
#
# PyPI trusted publisher (project: opengateways):
#   Owner: mrdulasolutions | Repo: open-gateway | Workflow: publish.yml | Environment: oss-release
# See docs/OSS_RELEASE.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish wheel to PyPI (opengateways)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pypi:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment: oss-release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build opengateways wheel
        run: |
          uv build -o dist
          ls -la dist/
      - name: Publish to PyPI (opengateways)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  ghcr:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

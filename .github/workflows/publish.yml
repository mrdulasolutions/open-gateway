name: Publish

# Builds wheels, publishes to GHCR on version tags.
# PyPI: name `opengateway` is taken (unrelated project); `opengateways` is hosted SaaS.
# OSS primary install: git @ tag or GHCR. PyPI job is skipped until a free name is reserved.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pypi:
    if: false  # skipped — see header comment
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "PyPI publish disabled for OSS opengateway (name collision)"

  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

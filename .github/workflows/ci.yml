name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + test
        run: |
          uv sync --all-extras
          # MCP 2.x removed mcp.server.fastmcp — pin is mcp>=1.0,<2; fail CI if import breaks
          uv run python -c "from mcp.server.fastmcp import FastMCP; import opengateway.mcp_server"
          uv run pytest tests/ -q

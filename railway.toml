# OpenGateway — Railway config-as-code (also see railway.json)
# One-click: https://railway.com/deploy/open-gateway
# Ship line: v0.1.2 — re-publish template after doc/Dockerfile changes (docs/RAILWAY.md)
# Docs: docs/RAILWAY.md · docs/RAILWAY_TEMPLATE.md
#
# After deploy:
#   1. Confirm OPENGATEWAY_AUTH_TOKEN is a Railway Variable (not only first-boot log)
#   2. Prefer Postgres + Redis plugins (no Volume required)
#   3. Domain is auto-wired → OPENGATEWAY_PUBLIC_URL via entrypoint
#   4. Entrypoint sets OPENGATEWAY_TRUST_PROXY=true on Railway (X-Forwarded-For)
#   5. Open /ui/ → create admin → mint agent tokens for MCP
#   6. Optional: OPENGATEWAY_DISABLE_SETUP_CLAIM=true after first browser claim
#
# Recommended Variables (template / dashboard):
#   OPENGATEWAY_AUTH_TOKEN, OPENGATEWAY_DATABASE_URL, OPENGATEWAY_REDIS_URL
#   OPENGATEWAY_MODE=public, OPENGATEWAY_NETWORK=public, OPENGATEWAY_AUDIT=true
#   OPENGATEWAY_OPEN_REGISTRATION=false, OPENGATEWAY_DB=none
#   OPENGATEWAY_TRUST_PROXY=true (auto on Railway)
#   OPENGATEWAY_PUBLIC_DOCS=false (keep /docs private under auth)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

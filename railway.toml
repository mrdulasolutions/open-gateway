# OpenGateway — Railway config-as-code (also see railway.json)
# One-click: README "Deploy on Railway" button
# Docs: docs/RAILWAY.md
#
# After deploy:
#   1. Set OPENGATEWAY_AUTH_TOKEN (or copy the generated one from first-boot logs)
#   2. Mount a Railway Volume at /data
#   3. Generate domain → https://<app>.up.railway.app/ui/

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

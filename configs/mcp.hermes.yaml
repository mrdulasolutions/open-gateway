# Merge under mcp_servers: in ~/.hermes/config.yaml
# RESTART Hermes after edits. Public hubs need OPENGATEWAY_AUTH_TOKEN.
# See docs/AGENTS_AUTH.md

  opengateway:
    command: uv
    args:
      - run
      - --directory
      - /path/to/open-gateway
      - opengateway
      - mcp
    env:
      OPENGATEWAY_URL: https://YOUR-APP.up.railway.app
      OPENGATEWAY_AUTH_TOKEN: ogk_from_live_ops_ui
      OPENGATEWAY_HARNESS: hermes
      OPENGATEWAY_AGENT_NAME: hermes

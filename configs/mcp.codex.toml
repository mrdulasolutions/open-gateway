# Merge into ~/.codex/config.toml
# RESTART Codex after edits. Public hubs need OPENGATEWAY_AUTH_TOKEN.
# See docs/AGENTS_AUTH.md

[mcp_servers.opengateway]
command = "uvx"
args = [
  "git+https://github.com/mrdulasolutions/open-gateway.git@v0.1.0",
  "mcp",
]

[mcp_servers.opengateway.env]
OPENGATEWAY_URL = "http://127.0.0.1:8765"
# OPENGATEWAY_AUTH_TOKEN = "ogk_from_live_ops_ui"
OPENGATEWAY_HARNESS = "codex"
OPENGATEWAY_AGENT_NAME = "codex"

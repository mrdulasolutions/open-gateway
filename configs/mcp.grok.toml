# Add this to ~/.grok/config.toml (or project .grok/config.toml)
# Then RESTART Grok CLI so OpenGateway tools appear (config is load-once).
#
# Local (internal gateway):
#   OPENGATEWAY_URL = "http://127.0.0.1:8765"
# Railway / public:
#   OPENGATEWAY_URL = "https://open-gateway-production.up.railway.app"
#   OPENGATEWAY_AUTH_TOKEN = "ogk_…"   # mint in Live Ops → Settings → Create agent token
# See docs/AGENTS_AUTH.md

[mcp_servers.opengateway]
command = "uv"
args = [
  "run",
  "--directory",
  "/path/to/open-gateway",
  "opengateway",
  "mcp",
]
# After: uv tool install git+https://github.com/mrdulasolutions/open-gateway.git
#   command = "opengateway"
#   args = ["mcp"]
env = {
  OPENGATEWAY_URL = "http://127.0.0.1:8765",
  # Required for public / Railway / LAN / serve / funnel:
  # OPENGATEWAY_AUTH_TOKEN = "ogk_from_live_ops_ui",
  OPENGATEWAY_HARNESS = "grok",
  OPENGATEWAY_AGENT_NAME = "grok",
}
enabled = true
startup_timeout_sec = 45

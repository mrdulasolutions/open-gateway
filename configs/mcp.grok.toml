# Add this to ~/.grok/config.toml (or project .grok/config.toml)
# Then RESTART Grok CLI so OpenGateway tools appear (config is load-once).
#
# Local (default):
#   OPENGATEWAY_URL = "http://127.0.0.1:8765"
# LAN / Tailscale / optional cloud:
#   OPENGATEWAY_URL = "https://your-hub.example.com"
#   OPENGATEWAY_AUTH_TOKEN = "ogk_…"   # mint in Live Ops → Agent tokens
# See docs/AGENTS_AUTH.md
#
# Install once:
#   uv tool install opengateways==0.1.2

[mcp_servers.opengateway]
command = "uvx"
args = [
  "opengateways==0.1.2",
  "mcp",
]
# Dev checkout alternative:
#   command = "uv"
#   args = ["run", "--directory", "/path/to/open-gateway", "opengateway", "mcp"]
env = {
  OPENGATEWAY_URL = "http://127.0.0.1:8765",
  # Required when hub uses --token / require_auth:
  # OPENGATEWAY_AUTH_TOKEN = "ogk_from_live_ops_ui",
  OPENGATEWAY_HARNESS = "grok",
  OPENGATEWAY_AGENT_NAME = "grok",
}
enabled = true
startup_timeout_sec = 45

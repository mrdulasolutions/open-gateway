[project]
name = "opengateways"
version = "0.1.2"
description = "OpenGateway — multi-agent collaboration hub for any harness (ACP + MCP)"
readme = "README.md"
authors = [
    { name = "MR Dula Enterprise, LLC", email = "matt@mrdula.solutions" }
]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "acp", "mcp", "multi-agent", "gateway", "collaboration", "tailscale"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "mcp>=1.0,<2",
    "typer>=0.15",
    "rich>=13.0",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
redis = [
    "redis>=5.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
push = [
    "pywebpush>=2.0",
]
deploy = [
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pywebpush>=2.0",
]

[project.scripts]
opengateways = "opengateway.cli:app"
opengateway = "opengateway.cli:app"

[project.urls]
Homepage = "https://github.com/mrdulasolutions/open-gateway"
Repository = "https://github.com/mrdulasolutions/open-gateway"
Documentation = "https://github.com/mrdulasolutions/open-gateway#readme"
Issues = "https://github.com/mrdulasolutions/open-gateway/issues"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opengateway"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
